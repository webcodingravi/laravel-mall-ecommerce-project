name: Deploy to ecommerce (FTP)

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.infinityfree.com
          username: if0_41079681
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /htdocs/
